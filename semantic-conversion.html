<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Semantic HTML</title>
</head>
<body>
    <header>
        <div>My Site</div>
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
            </ul>
        </nav>
    </header>
    <main>
        <article>
            <h1>Welcome to My Site</h1>
            <p>This is my first paragraph....</p>
            <p>This is my second paragraph....</p>
        </article>
        <aside>
            <div>Recent Posts</div>
        </aside>
    </main>
    <footer>
        <p>© 2026</p>
    </footer>
</body>
</html>
