<main>
<h2>Contact Me</h2>
<form>
<fieldset>
<legend>Personal Information</legend>
<label for="fullname">Full Name:</label><br>
<input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required><br><br>
<label for="email">Email:</label><br>
<input type="email" id="email" name="email" placeholder="example@gmail.com" required><br><br>
<label for="phone">Phone:</label><br>
<input type="tel" id="phone" name="phone" placeholder="0300-1234567"><br><br>
</fieldset>
<fieldset>
<legend>Message Details</legend>
<label for="subject">Subject:</label><br>
<select id="subject" name="subject" required>
<option value="">--Choose--</option>
<option value="general">General Inquiry</option>
<option value="project">Project Collaboration</option>
<option value="feedback">Feedback</option>
</select><br><br>
<label for="message">Message:</label><br>
<textarea id="message" name="message" placeholder="Write at least 50 characters..." minlength="50" required rows="5"></textarea><br><br>
<input type="checkbox" id="newsletter" name="newsletter">
<label for="newsletter">Subscribe to newsletter</label><br><br>
</fieldset>
<button type="submit">Submit</button>
</form>
</main>
